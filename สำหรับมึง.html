<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สำหรับมึง</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
        }
        h1 {
            color: #ff4d6d;
        }
        p {
            font-size: 18px;
            color: #333;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: #ff4d6d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #e63950;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>ถึงคนอยากมีง</h1>
    <p>
        เราอยากบอกว่า<br>
    
    </p>
    <button onclick="alert('ควย')">กดตรงนี้สิ</button>
</div>

</body>
</html>
